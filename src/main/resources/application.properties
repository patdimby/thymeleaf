spring.application.name=thymeleaf
# Supply credentials through the environment rather than committing secrets.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventory}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
# When unset, the JWT service uses an ephemeral key for local development.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-millis=${JWT_EXPIRATION_MILLIS:86400000}
